name: Run pinned scanners
description: >-
  Install pinned Trivy and Checkov, install gitleaks through install-gitleaks, then
  write their JSON reports to $RUNNER_TEMP/scan. Archives are checked against
  SHA-256 values pinned in this repository. gitleaks reports contain secret values,
  so the reports stay on the runner and must never be uploaded.

inputs:
  target:
    description: Repository-relative directory to scan.
    required: false
    default: sample-app

runs:
  using: composite
  steps:
    - name: Install pinned Trivy and Checkov
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TRIVY_VERSION: "0.74.0"
        TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
        CHECKOV_VERSION: "3.3.20"
      run: |
        set -euo pipefail
        bin="$RUNNER_TEMP/bin"
        downloads="$RUNNER_TEMP/downloads"
        mkdir -p "$bin" "$downloads"

        trivy_archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
        gh release download "v${TRIVY_VERSION}" --repo aquasecurity/trivy \
          --pattern "$trivy_archive" --dir "$downloads"
        echo "${TRIVY_SHA256}  ${downloads}/${trivy_archive}" | sha256sum --check -
        tar -xzf "$downloads/$trivy_archive" -C "$bin" trivy

        python3 -m venv "$RUNNER_TEMP/checkov-venv"
        "$RUNNER_TEMP/checkov-venv/bin/python" -m pip install --quiet "checkov==${CHECKOV_VERSION}"

        # Only the scanner binaries join PATH. A GITHUB_PATH entry reaches every later
        # step, so Checkov is called by path below. Putting its venv bin on PATH would
        # shadow setup-python's python, which runs pytest and wiki_tool in the capture job.
        echo "$bin" >> "$GITHUB_PATH"

    - name: Install pinned gitleaks
      uses: ./.github/actions/install-gitleaks

    - name: Run scanners on the target
      shell: bash
      env:
        SCAN_TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        out="$RUNNER_TEMP/scan"
        mkdir -p "$out/checkov"

        # Findings do not fail these commands. Capture decides what becomes evidence.
        trivy config --format json --output "$out/trivy.json" "$SCAN_TARGET"
        "$RUNNER_TEMP/checkov-venv/bin/checkov" -d "$SCAN_TARGET" --framework terraform \
          -o json --soft-fail --output-file-path "$out/checkov"
        mv "$out/checkov/results_json.json" "$out/checkov.json"
        # Do not add --redact here. Capture derives each finding ID from a hash of the
        # secret, so redacted values would give every leak in a file the same identity.
        # Do not add a gate config here either. The repo-wide allowlist must not hide
        # findings from capture.
        gitleaks dir "$SCAN_TARGET" --report-format json \
          --report-path "$out/gitleaks.json" --exit-code 0
