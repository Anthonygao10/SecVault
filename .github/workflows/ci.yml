name: CI

# Required pull request checks. Deterministic only: no model calls and no writes
# to the repository. The ci job runs lint and tests. The secrets job runs the
# redacted gitleaks gate over the full history.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install SecVault and dev tools
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Pytest
        run: python -m pytest -q

      - name: Vault lint
        run: python -m wiki_tool lint

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the gate must see secrets that were committed and later deleted.
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned gitleaks
        uses: ./.github/actions/install-gitleaks

      - name: Scan full history (redacted output)
        # --redact keeps secret values out of public logs. run-scanners must not use it,
        # because capture derives finding IDs from the real secret hash.
        run: gitleaks git --redact --no-banner --config .github/gitleaks-gate.toml .
